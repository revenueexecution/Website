name: V18 widen site

on:
  push:
    paths:
      - '.github/workflows/v18-widen-site.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V18 wider site container
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          assert '<!-- Revenue Execution Owner Website V17 -->' in s
          assert '.wrap{max-width:1180px;margin:auto;padding:0 28px}' in s
          assert '<a href="resources/">Resources</a>' in s
          s = s.replace('<!-- Revenue Execution Owner Website V17 -->','<!-- Revenue Execution Owner Website V18 -->',1)
          s = s.replace('.wrap{max-width:1180px;margin:auto;padding:0 28px}', '.wrap{max-width:1320px;margin:auto;padding:0 28px}',1)
          p.write_text(s)
          PY
      - name: Commit V18 and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/v18-widen-site.yml
          git commit -m "Owner website V18: widen site container"
          git push