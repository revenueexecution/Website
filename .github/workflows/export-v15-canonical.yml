name: Export V15 Canonical File

on:
  push:
    paths:
      - '.github/workflows/export-v15-canonical.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: owner-website-v15-canonical
          path: index.html
          if-no-files-found: error
