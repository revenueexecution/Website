name: Owner Website V12 Sync

on:
  push:
    paths:
      - '.github/workflows/v12-sync.yml'

permissions:
  contents: write

jobs:
  apply-v12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified V12 navigation polish
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<!-- Revenue Execution Owner Website V11 -->', '<!-- Revenue Execution Owner Website V12 -->'),
              ('.links{display:flex;align-items:center;gap:17px;font-size:13px;font-weight:750}', '.links{display:flex;align-items:center;gap:28px;font-size:13px;font-weight:750}'),
              ('\n</style>\n</head>', '\n.links a:not(.btn){transition:color .18s ease,opacity .18s ease}\n.links a:not(.btn):hover{color:var(--g);opacity:.88}\n\n</style>\n</head>')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected V11 pattern missing: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit V12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Owner website V12: polish nav spacing and hover states"
          git push
