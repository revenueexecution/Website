name: Owner Website V13 Sync

on:
  push:
    paths:
      - '.github/workflows/v13-sync.yml'

permissions:
  contents: write

jobs:
  apply-v13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved V13 changes 13 and 14
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('<!-- Revenue Execution Owner Website V12 -->', '<!-- Revenue Execution Owner Website V13 -->'),
              ('.journey-card:hover,.journey-card.active{border-color:var(--g);transform:translateY(-2px);box-shadow:0 10px 24px #10252b0d}.journey-card.grow{border-color:var(--g)}', '.journey-card:hover,.journey-card.active{border-color:var(--g);transform:translateY(-2px);box-shadow:0 10px 24px #10252b0d}'),
              ('.cat{font-size:9px;text-transform:uppercase;letter-spacing:.08em;background:var(--m);color:var(--g2);padding:5px 8px;border-radius:999px;font-weight:900}.issue h3{font-size:21px;line-height:1.18;margin:12px 0 8px}.issue p{font-size:14px;color:var(--x);margin:0}', '.cat{font-size:9px;text-transform:uppercase;letter-spacing:.08em;background:var(--m);color:var(--g2);padding:5px 8px;border-radius:999px;font-weight:900}.goal-label{display:block;margin:13px 0 3px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--g2);font-weight:900}.issue h3{font-size:21px;line-height:1.18;margin:12px 0 8px}.issue p{font-size:14px;color:var(--x);margin:0}'),
              ('issueData.forEach((d,i)=>{ig.innerHTML+=`<button class="issue" data-issue="${i}"><div class="top"><span class="num">0${i+1}</span><span class="cat">${d[1]}</span></div><h3>${d[2]}</h3><p>${d[3]}</p><span class="card-explore">Explore →</span></button>`});', 'issueData.forEach((d,i)=>{ig.innerHTML+=`<button class="issue" data-issue="${i}"><div class="top"><span class="num">0${i+1}</span><span class="cat">${d[1]}</span></div><h3>${d[2]}</h3><span class="goal-label">Example owner goal</span><p>${d[3]}</p><span class="card-explore">Explore →</span></button>`});'),
              ('issueDetail.innerHTML=`<div><div class="ey" style="color:#9ed0c0">${s[0]}</div><h3>${s[1]}</h3><p>Start with the owner outcome, then work backwards through the evidence.</p></div>', 'issueDetail.innerHTML=`<div><div class="ey" style="color:#9ed0c0">${s[0]}</div><span class="goal-label" style="color:#9ed0c0">Example owner goal</span><h3>${s[1]}</h3><p>Start with the owner outcome, then work backwards through the evidence.</p></div>')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected V12 pattern missing: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit V13
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Owner website V13: clarify example goals and fix card highlight"
          git push
