name: V20 index finalize

on:
  push:
    paths:
      - '.github/workflows/v20-index-finalize.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize homepage V20
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<!-- Revenue Execution Owner Website V19 -->','<!-- Revenue Execution Owner Website V20 -->',1)
          if '/favicon.png?v=20' not in s:
              s = s.replace('</head>','<link rel="icon" type="image/png" href="/favicon.png?v=20">\n<link rel="apple-touch-icon" href="/favicon.png?v=20">\n</head>',1)
          s = s.replace('<script src="site.js"></script>','<script src="/site.js"></script>',1)
          p.write_text(s)
          PY
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/v20-index-finalize.yml
          git commit -m "Owner website V20: finalize cookie and favicon rollout"
          git push
