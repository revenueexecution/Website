name: Exact V15 file sync

on:
  push:
    paths:
      - '.github/workflows/sync-v15-exact.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact V15 source
        run: |
          cat .sync/v15.part* | base64 -d > index.html
          echo "0b71144c079b4a0432c8070ab4f45ff5ae8cf6bef21f89f39745ec52bd322f65  index.html" | sha256sum -c -
          test "$(wc -c < index.html)" -eq 40682
      - name: Commit exact source and clean staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .sync/v15.part* .github/workflows/sync-v15-exact.yml
          git commit -m "Owner website V15: exact file sync"
          git push
