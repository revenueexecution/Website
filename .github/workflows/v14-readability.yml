name: Owner Website V14 Readability

on:
  push:
    paths:
      - '.github/workflows/v14-readability.yml'

permissions:
  contents: write

jobs:
  apply-v14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V14 readability and About spacing pass
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('<!-- Revenue Execution Owner Website V13 -->','<!-- Revenue Execution Owner Website V14 -->'),
            ('.head p{color:var(--x);font-size:17px}', '.head p{color:var(--x);font-size:18px;line-height:1.6}'),
            ('.issue p{font-size:14px;color:var(--x);margin:0}', '.issue p{font-size:15px;line-height:1.5;color:var(--x);margin:0}'),
            ('.contextbox span{font-size:12px;color:var(--i)}', '.contextbox span{font-size:14px;line-height:1.5;color:var(--i)}'),
            ('.zone p{font-size:13px;margin:0 0 18px;color:var(--x)}', '.zone p{font-size:15px;line-height:1.5;margin:0 0 18px;color:var(--x)}'),
            ('.stage small{display:block;color:var(--x);font-size:11px;margin-top:5px;line-height:1.35}', '.stage small{display:block;color:var(--x);font-size:13px;margin-top:6px;line-height:1.45}'),
            ('.box span{font-size:12px}', '.box span{font-size:14px;line-height:1.5}'),
            ('.row{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--l);font-size:13px}', '.row{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--l);font-size:15px;line-height:1.5}'),
            ('.rootcard p{font-size:12px;color:#c5d2d4}', '.rootcard p{font-size:14px;line-height:1.5;color:#c5d2d4}'),
            ('.action b{font-size:12px}.action span{display:block;font-size:10px;color:var(--x)}', '.action b{font-size:13px}.action span{display:block;font-size:12px;line-height:1.4;color:var(--x)}'),
            ('.benefits b{display:block;font-size:12px}.benefits span{font-size:10.5px;color:var(--x)}', '.benefits b{display:block;font-size:14px}.benefits span{font-size:13px;line-height:1.45;color:var(--x)}'),
            ('.symptom{text-align:center;background:var(--s);padding:9px;border-radius:11px;font-weight:850;font-size:12px}', '.symptom{text-align:center;background:var(--s);padding:10px;border-radius:11px;font-weight:850;font-size:13px}'),
            ('.lane span{border:1px solid var(--l);border-radius:10px;padding:9px;text-align:center;font-size:10px}', '.lane span{border:1px solid var(--l);border-radius:10px;padding:10px;text-align:center;font-size:12px}'),
            ('.proof{background:var(--a)}.proofgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:45px}.about{display:grid;grid-template-columns:175px 1fr;gap:22px}.about img{width:175px;aspect-ratio:1;object-fit:cover;border-radius:18px}', '.proof{background:var(--a)}.proofgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:start}.about{display:grid;grid-template-columns:175px 1fr;gap:32px;align-items:start}.about img{width:175px;aspect-ratio:1;object-fit:cover;border-radius:18px}.about h2{margin:8px 0 18px}.about .lead{margin:0 0 18px}.about p:last-child{margin:0}'),
            ('blockquote{margin:0;background:#fff;border-radius:18px;padding:24px;font-size:18px}blockquote small{display:block;margin-top:14px;color:var(--x);font-size:12px}', 'blockquote{margin:0;background:#fff;border-radius:18px;padding:28px;font-size:18px;line-height:1.6}blockquote small{display:block;margin-top:16px;color:var(--x);font-size:14px;line-height:1.45}'),
            ('.pc{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;min-height:190px}.pc h3{font-size:17px}.pc p{font-size:11.5px;color:var(--x)}', '.pc{background:#fff;border:1px solid var(--l);border-radius:16px;padding:20px;min-height:190px}.pc h3{font-size:18px}.pc p{font-size:14px;line-height:1.5;color:var(--x)}'),
            ('.t{padding:25px 8px 0;border-top:3px solid var(--m);font-size:10px;position:relative}', '.t{padding:25px 8px 0;border-top:3px solid var(--m);font-size:12px;line-height:1.4;position:relative}'),
            ('details p{color:var(--x);font-size:13px}', 'details p{color:var(--x);font-size:15px;line-height:1.55}'),
            ('footer{padding:26px 0;border-top:1px solid var(--l);font-size:12px;color:var(--x)}', 'footer{padding:26px 0;border-top:1px solid var(--l);font-size:13px;color:var(--x)}')
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit('Expected V13 pattern missing: ' + old[:120])
            s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit V14
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Owner website V14: improve readability and About spacing"
          git push
