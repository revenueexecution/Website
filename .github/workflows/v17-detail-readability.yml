name: V17 detail readability

on:
  push:
    paths:
      - '.github/workflows/v17-detail-readability.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V17 expanded detail heading readability
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
            ('<!-- Revenue Execution Owner Website V16 -->','<!-- Revenue Execution Owner Website V17 -->'),
            ('.contextdetail h3{font-size:24px;margin:6px 0 8px}.contextdetail p{color:var(--x);margin:0}.contextgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}', '.contextdetail h3{font-size:24px;margin:6px 0 8px}.contextdetail p{color:var(--x);margin:0}.contextdetail .ey{font-size:13px;color:var(--i)!important;letter-spacing:.1em}.contextdetail .goal-label{font-size:12px;color:var(--i)!important;letter-spacing:.06em}.contextgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}'),
            ('.contextbox b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--g2);margin-bottom:5px}', '.contextbox b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--g2);margin-bottom:5px}')
          ]
          for old, new in replacements:
              assert s.count(old) == 1, old
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit V17 and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/v17-detail-readability.yml
          git commit -m "Owner website V17: improve expanded detail heading readability"
          git push
